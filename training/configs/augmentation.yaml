audio:
  sample_rate: 16000
  window_samples: 48000
augmentation:
  enabled: true
  unchanged_probability: 0.20
  max_random_transforms: 3
  padding: zero
  gain: {probability: 0.45, min_db: -8.0, max_db: 6.0}
  noise: {probability: 0.45, min_snr_db: 8.0, max_snr_db: 35.0, asset_dir: data/augmentation_assets/noise}
  rir: {probability: 0.25, min_wet: 0.20, max_wet: 0.80, asset_dir: data/augmentation_assets/rir}
  resample: {probability: 0.25, intermediate_rates: [8000, 12000, 22050, 24000]}
  filtering: {probability: 0.25, max_db: 6.0, telephone_probability: 0.25}
  speed: {probability: 0.20, min_factor: 0.95, max_factor: 1.05}
  saturation: {probability: 0.10, min_drive: 1.1, max_drive: 1.8}
  codec:
    enabled: true
    probability: 0.20
    codec: opus
    bitrates_kbps: [12, 16, 24]
    application: voip
